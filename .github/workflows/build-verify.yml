# ---------------------------------------------------------------------------
# Compiles, tests, checks and assembles the project, then blocks on the
# SonarCloud quality gate.
#
# The body lives in rubensgomes-org/azure-workflows and is shared with every
# other rubensgomes-org Spring Boot repository. Only what GitHub cannot
# delegate stays here: the "Run workflow" button, the permissions and the
# concurrency group. To change what the build DOES, change it there.
#
# Pinned at @v1, a MOVING major tag: patches arrive without editing this file,
# and the shared workflow pins its own composite actions at the same tag.
#
# Dispatch-only. It used to run on every push to main, which meant a release
# paid for CI twice -- once for the push, once for the release commits.
#
# @author Rubens Gomes
# ---------------------------------------------------------------------------
name: build-verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    # Secrets are mapped EXPLICITLY. "secrets: inherit" forwards only secrets
    # whose names match the callee's declarations, so it would not map
    # RUBENS_PAT_TOKEN onto the declared packages-token.
    uses: rubensgomes-org/azure-workflows/.github/workflows/gradle-build-verify.yml@v1
    secrets:
      packages-token: ${{ secrets.RUBENS_PAT_TOKEN }}
      sonar-token: ${{ secrets.SONAR_TOKEN }}
