# ---------------------------------------------------------------------------
# Runs "./gradlew release" (net.researchgate.release).
#
# The body lives in rubensgomes-org/azure-workflows. "contents: write" is
# granted HERE because a reusable workflow can only ever hold permissions the
# caller already has.
#
# @author Rubens Gomes
# ---------------------------------------------------------------------------
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: rubensgomes-org/azure-workflows/.github/workflows/gradle-release.yml@v1
    secrets:
      # Needs repo (to push the release commits and tag) as well as
      # read:packages (to resolve the version catalog).
      packages-token: ${{ secrets.RUBENS_PAT_TOKEN }}
